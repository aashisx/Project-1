<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>
</head>
 <body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Vehicle - Car Rental</title>
    <link rel="stylesheet" href="booking-page.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Hero Section with Search -->
    <div class="hero-section">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="hero-text">
                <h1>Find Your Perfect Ride</h1>
                <p>Rent cars and bikes for any journey, anywhere, anytime</p>
            </div>
            
            <div class="search-card">
                <div class="search-grid">
                    <!-- Location -->
                    <div class="search-field">
                        <label>
                            <i class="fas fa-map-marker-alt"></i>
                            Pickup Location
                        </label>
                        <input type="text" id="searchLocation" placeholder="Enter city or location">
                    </div>

                    <!-- Pickup Date -->
                    <div class="search-field">
                        <label>
                            <i class="fas fa-calendar"></i>
                            Pickup Date
                        </label>
                        <input type="date" id="pickupDate">
                    </div>

                    <!-- Return Date -->
                    <div class="search-field">
                        <label>
                            <i class="fas fa-calendar"></i>
                            Return Date
                        </label>
                        <input type="date" id="returnDate">
                    </div>

                    <!-- Search Button -->
                    <div class="search-field">
                        <label class="transparent">Search</label>
                        <button class="search-btn">Search Vehicles</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="container">
            <div class="content-grid">
                <!-- Filters Sidebar -->
                <div class="filters-sidebar">
                    <div class="filters-card">
                        <h3>Filters</h3>
                        
                        <!-- Vehicle Type -->
                        <div class="filter-group">
                            <label class="filter-label">Vehicle Type</label>
                            <div class="filter-buttons">
                                <button class="filter-btn active" data-type="all">All</button>
                                <button class="filter-btn" data-type="luxury">Luxury</button>
                                <button class="filter-btn" data-type="economy">Economy</button>
                                <button class="filter-btn" data-type="performance">Performance</button>
                                <button class="filter-btn" data-type="bike">Bikes</button>
                            </div>
                        </div>

                        <!-- Price Range -->
                        <div class="filter-group">
                            <label class="filter-label">Price Range:$ <span id="minPrice">0</span> -$ <span id="maxPrice">500</span>/day</label>
                            <div class="price-slider">
                                <input type="range" id="priceMin" min="0" max="500" value="0">
                                <input type="range" id="priceMax" min="0" max="500" value="500">
                            </div>
                        </div>

                        <!-- Sort By -->
                        <div class="filter-group">
                            <label class="filter-label">Sort By</label>
                            <select id="sortBy">
                                <option value="price">Price: Low to High</option>
                                <option value="rating">Rating: High to Low</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Vehicle Grid -->
                <div class="vehicles-section">
                    <div class="vehicles-header">
                        <h2>Available Vehicles (<span id="vehicleCount">13</span>)</h2>
                    </div>

                    <div class="vehicles-grid" id="vehiclesGrid">
                        <!-- Vehicle cards will be inserted here by JavaScript -->
                    </div>

                    <div class="no-results" id="noResults" style="display: none;">
                        <p>No vehicles found matching your criteria</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Registration-->
    <div class="modal-overlay"></div>
    <div class="form-container">
      <button class="form-close" type="button">&times;</button>
      <h1 class="form-title">Book Your Service</h1>
      
      <form id="registrationForm">
        <div class="form-group">
          <label for="name" class="form-label">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            class="form-input"
            placeholder="Enter your full name"
          />
          <div class="error-message" id="nameError"></div>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="Enter your email"
          />
          <div class="error-message" id="emailError"></div>
        </div>

        <div class="form-group">
          <label for="phone" class="form-label">Phone Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            class="form-input"
            placeholder="Enter your phone number"
          />
          <div class="error-message" id="phoneError"></div>
        </div>

        <div class="form-group">
          <label for="pickupDate" class="form-label">Pickup Date</label>
          <input
            type="date"
            id="pickupDate"
            name="pickupDate"
            class="form-input"
            required
          />
          <div class="error-message" id="pickupDateError"></div>
        </div>

        <div class="form-group">
          <label for="address" class="form-label">Pick up location</label>
          <textarea
            id="address"
            name="address"
            class="form-input"
            placeholder="Enter your complete address"
            rows="3"
            style="resize: vertical; min-height: 80px;"
          ></textarea>
          <div class="error-message" id="addressError"></div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          Book Now
        </button>
        
        <div class="loading" id="loading">Processing your request...</div>
        <div class="success-message" id="successMessage">
          Registration successful! Your booking request has been submitted.
        </div>
      </form>
    </div>

    <script src="booking-page.js"></script>
</body>
</html>
</body>
</html>
